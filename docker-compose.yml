services:
  erp_agent_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_agent_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@erp_postgres_db:5432/erp_db?ssl=disable
      - REDIS_URL=redis://erp_redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey123}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
    depends_on:
      erp_postgres_db:
        condition: service_healthy
      erp_redis:
        condition: service_started
  
  celery_worker:
    build: .
    container_name: erp_celery_worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@erp_postgres_db:5432/erp_db?ssl=disable
      - REDIS_URL=redis://erp_redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey123}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    volumes:
      - ./app:/app/app  
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
    depends_on:
      erp_postgres_db:
        condition: service_healthy
      erp_redis:
        condition: service_started
    restart: always

  erp_postgres_db:
    image: pgvector/pgvector:pg16
    container_name: erp_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp_db
    ports:
      - "5432:5432"
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  erp_redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - erp_redis_data:/data

volumes:
  erp_postgres_data:
  erp_redis_data: